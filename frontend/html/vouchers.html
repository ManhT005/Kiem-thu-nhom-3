<!doctype html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý voucher</title><link rel="stylesheet" href="/css/operations.css"></head><body>
<header><h1>Quản lý voucher</h1><nav><a href="/admin">Tài khoản và sản phẩm</a><a href="/inventory">Kho</a><a href="/">Cửa hàng</a></nav></header>
<main><p id="voucher-message" role="status" aria-live="polite"></p>
<section><h2 id="voucher-title">Tạo voucher</h2><p>Đơn hàng đã tạo giữ nguyên mức giảm. Lượt đang giữ cho đơn chưa thanh toán được trả lại khi đơn hủy hoặc hết hạn.</p>
<form id="voucher-form">
<label>Mã ưu đãi <input name="code" required minlength="3" maxlength="64" pattern="[A-Za-z0-9_-]{3,64}"></label>
<label>Loại giảm <select name="discountType"><option value="PERCENT">Phần trăm</option><option value="FIXED">Số tiền</option></select></label>
<label>Giá trị giảm <input name="discountValue" type="number" min="0.01" max="100" step="0.01" required></label>
<label>Đơn tối thiểu (VND) <input name="minimumOrderAmount" type="number" min="0" max="999999999999.99" step="0.01" value="0" required></label>
<label>Trần giảm (VND, để trống nếu không giới hạn) <input name="maximumDiscountAmount" type="number" min="0" max="999999999999.99" step="0.01"></label>
<label>Bắt đầu <input name="startAt" type="datetime-local" required></label><label>Kết thúc <input name="endAt" type="datetime-local" required></label>
<label>Tổng lượt (trống = không giới hạn) <input name="usageLimit" type="number" min="0" max="2147483647" step="1"></label>
<label>Lượt mỗi tài khoản <input name="perUserLimit" type="number" min="0" max="2147483647" step="1" value="1" required></label>
<label>Mô tả <input name="description" maxlength="500"></label><label><span>Cho phép sử dụng</span><input name="enabled" type="checkbox" checked></label>
<button type="submit" id="save-voucher">Lưu voucher</button><button type="button" id="new-voucher">Voucher mới</button></form></section>
<section><h2>Danh sách voucher</h2><form id="voucher-filter">
<label>Mã <input name="code" maxlength="64"></label><label>Trạng thái <select name="enabled"><option value="">Tất cả</option><option value="true">Đang bật</option><option value="false">Đã tắt</option></select></label><button type="submit">Lọc voucher</button></form>
<div class="table-wrap"><table><thead><tr><th>Mã</th><th>Mức giảm</th><th>Thời hạn</th><th>Lượt dùng / tổng</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="vouchers"></tbody></table></div>
<button type="button" id="voucher-prev">Trang trước</button><span id="voucher-page"></span><button type="button" id="voucher-next">Trang sau</button></section>
</main><script src="/js/vouchers.js"></script></body></html>
