services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: phase2-test-only
      MYSQL_DATABASE: clothes_closure_test
    ports:
      - "127.0.0.1:13316:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-pphase2-test-only"]
      interval: 5s
      timeout: 5s
      retries: 30
